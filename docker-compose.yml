# ============================================================
# Ambiente completo do Servia (F0.2)
#
# Sobe a API e o PostgreSQL com um comando:
#   docker compose up --build
#
# A API espera o banco ficar saudável antes de iniciar, evitando
# falha de conexão na primeira subida.
# ============================================================

services:
  database:
    image: postgres:17-alpine
    container_name: servia-database
    environment:
      POSTGRES_DB: servia
      POSTGRES_USER: servia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servia_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - servia-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servia -d servia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src
      dockerfile: Servia.Api/Dockerfile
    container_name: servia-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Ambiente de desenvolvimento local. Em producao real, use outro
      # arquivo de compose com ASPNETCORE_ENVIRONMENT=Production.
      # Development e necessario aqui porque o AllowedHosts de producao
      # (servia.app;*.servia.app) rejeita localhost com 400.
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: Postgres
      ConnectionStrings__DefaultConnection: >-
        Host=database;Port=5432;Database=servia;Username=servia;Password=${POSTGRES_PASSWORD:-servia_dev_password}
      # Chave de assinatura JWT. Em producao real, vem de um cofre.
      # Aqui e gerada por variavel de ambiente com valor padrao de
      # desenvolvimento, para o ambiente subir sem configuracao manual.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-servia-dev-only-signing-key-change-in-production-32chars}
    ports:
      - "8080:8080"
    healthcheck:
      # curl e instalado no Dockerfile para este health check.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  servia-data:
