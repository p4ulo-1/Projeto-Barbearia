# ============================================================
# Pipeline de integração contínua do Servia (F0.3)
#
# Executa em todo push e pull request para main:
#   1. Restore e build da solução
#   2. Testes automatizados
#   3. Build da imagem Docker
#
# O pipeline falha se qualquer etapa falhar: um PR só é aceitável
# quando build e testes passam.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Servia.slnx

      - name: Build
        run: dotnet build src/Servia.slnx --no-restore --configuration Release

      - name: Testes
        run: dotnet test src/Servia.slnx --no-build --configuration Release --verbosity normal

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build da imagem
        run: |
          docker build \
            --file src/Servia.Api/Dockerfile \
            --tag servia-api:${{ github.sha }} \
            src
