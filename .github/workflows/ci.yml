# ============================================================
# Pipeline de integração contínua do Servia (F0.3)
#
# Executa em todo push e pull request para main:
#   1. Restore e build da solução
#   2. Testes automatizados
#   3. Instalação, testes e build do frontend oficial para desenvolvimento
#   4. Build da imagem Docker
#
# O pipeline falha se qualquer etapa falhar: um PR só é aceitável
# quando build e testes passam.
# ============================================================

name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — instalação, testes e build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Tipos
        run: npm run typecheck

      - name: Build
        run: npm run build

  build-and-test:
    name: Build e testes
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Servia.slnx

      - name: Build
        run: dotnet build src/Servia.slnx --no-restore --configuration Release

      - name: Testes
        run: dotnet test src/Servia.slnx --no-build --configuration Release --verbosity normal

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-24.04
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build da imagem
        run: |
          docker build \
            --file src/Servia.Api/Dockerfile \
            --tag servia-api:${{ github.sha }} \
            src
